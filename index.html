<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITS AI A卷模擬試題 - 模擬測驗與解析</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
    .container { max-width: 860px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--panel-border); padding-bottom: 20px; }
    h1 { color: var(--primary); margin-bottom: 8px; font-size: 1.8rem; }
    p.subtitle { color: var(--muted); margin: 0; font-size: 0.95rem; }

    .score-board {
      display: none;
      background: var(--panel);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
    }
    .score-board h2 { margin-top: 0; color: var(--primary); }
    .score-number { font-size: 3rem; font-weight: 800; color: var(--success); margin: 10px 0; }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    .q-number { font-weight: bold; color: var(--primary); font-size: 1.1rem; margin-bottom: 10px; }
    .q-text { font-size: 1rem; margin-bottom: 15px; white-space: pre-line; }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 15px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-label:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--primary); }
    .option-label input { margin-top: 4px; }

    .explanation {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.6);
      border-left: 4px solid var(--primary);
      font-size: 0.92rem;
    }
    .explanation.correct { border-left-color: var(--success); }
    .explanation.incorrect { border-left-color: var(--error); }
    .exp-title { font-weight: bold; margin-bottom: 5px; }

    .submit-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: #0f172a;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 30px;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: var(--primary-hover); color: white; }

    /* Result styles */
    .correct-ans { color: var(--success); font-weight: bold; }
    .wrong-ans { color: var(--error); font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>ITS AI 認證 - A卷模擬測驗</h1>
    <p class="subtitle">共 50 題 | 題題附帶詳細解析 | 點擊下方按鈕交卷並查看分數</p>
  </header>

  <div id="scoreBoard" class="score-board">
    <h2>測驗完成！</h2>
    <p>你的得分為：</p>
    <div id="scoreText" class="score-number">0 / 100</div>
    <p id="scoreSummary"></p>
  </div>

  <form id="quizForm">
    <div id="questionsContainer"></div>
    <button type="button" class="submit-btn" onclick="submitQuiz()">提交考卷並查看分數與解析</button>
  </form>
</div>

<script>
const quizData = [
  {
    id: 1,
    q: "下列哪個應用程式實作時並未使用 AI?",
    type: "single",
    options: [
      "A. 電子郵件自動完成功能",
      "B. 預測型瀏覽器搜尋列",
      "C. 傳訊平台的文字轉表情圖示程式",
      "D. 電子郵件垃圾郵件篩選器"

    ans: ["C"],
    exp: "【正確答案：C】\n文字轉表情圖示（Text-to-Emoji）通常只是傳統的字串比對或規則基底對照表（例如將 ':)' 轉成 😊），不需要 AI 模型；而自動完成、搜尋預測與垃圾郵件過濾皆使用了機器學習與自然語言處理（NLP）技術。"
  },
  {
    id: 2,
    q: "一間汽車經銷公司想根據先前的銷售資料，使用 AI 預測任何指定日期的來客數，以便運用這項資料制定每週計畫。\n對這間經銷公司而言，最重要的 AI 模型成功指標是什麼?",
    type: "single",
    options: [
      "A. 產生的預測結果可協助經銷公司管理庫存及安排值班員工，進而增加獲利。",
      "B. 每天的預測結果差異越小越好。",
      "C. 模型能夠有效率地即時執行。",
      "D. 模型可以每週更新。"
    ],
    ans: ["A"],
    exp: "【正確答案：A】\n商業 AI 專案最關鍵的成功指標是「能否達成業務目標與產生價值（如增加獲利、優化營運與人力安排）」，而不單純只是技術層面的執行速度或更新頻率。"
  },
  {
    id: 3,
    q: "一間保險公司會根據客戶對於 10 個是非題的答案判斷他們是否符合折扣資格；公司的 CEO 想要制定一項用於判斷客戶優惠資格的計畫，代替保險代理人詢問這些問題。這項計畫必須盡可能達到快速可靠的成效，CEO 詢問針對這種情況，您會推薦使用哪種 AI。\n請問您該如何回答這位 CEO?",
    type: "single",
    options: [
      "A. 在這種情況下，AI 並非效率最高的解決方案，因為這個問題只需使用少數決策陳述式就能處理妥當。",
      "B. 叢集演算法能將答案類似的客戶分入同一折扣群組，因此是最佳解決方案。",
      "C. 神經網路能根據客戶對問題的答案學會預測對方的保險折扣獲取資格，因此是最佳解決方案。",
      "D. 由於所有折扣類別都已經有充足的代表性訓練資料，因此無論使用哪種機器學習演算法，都能快速學會正確的折扣類別。"
    ],
    ans: ["A"],
    exp: "【正確答案：A】\n並非所有問題都需要 AI。針對僅有 10 個是非題且規則明確的情境，使用傳統的程式條件判斷（If-Else 決策陳述式）開發最快、成本最低且最可靠。"
  },
  {
    id: 4,
    q: "哪種人工智慧演算法或應用程式會使用未標記資料?",

    exp: "【正確答案：A】\n叢集（Clustering）屬於非監督式學習（Unsupervised Learning），專門用來處理未標記（Unlabeled）的資料；物件偵測、分類與機器翻譯通常需要有標記的訓練資料。"

  {

    type: "single",
    options: [
      "A. 增強式學習 (Reinforcement Learning)",

  },

  },
  {

    q: "一間動物醫院聘請您擔任專案經理，他們想使用機器學習技術預測透過 X 光找到的貓狗腫瘤中，有哪些特徵能為不同患者進行最準確的風險分類。您可以取得過去 10 年所有醫療記錄（包含造影圖像）。\n請問您會選擇讓下列哪兩位人員加入團隊?（請選擇 2 個答案）",
    type: "multiple",

      "C. 擅長照顧病弱寵物的當地寵物旅館店主。",
      "D. 經常在手術室和化療門診中協助進行寵物手術及照護的獸醫技師。",
      "E. 為該醫院提供化療藥物的製藥公司銷售代表。",

  {

    options: [
      "A. 資料擷取 (Data Extraction / Data Poisoning)",

    ans: ["A"],
    exp: "【正確答案：A】\n惡意攻擊者常透過攻擊「資料擷取/資料投毒（Data Poisoning）」過程，注入有害或偏頗的訓練資料來破壞 AI 系統的判斷力。"
  },
  {
    id: 10,
    q: "貴組織正在針對特定用途開發一套 AI 系統，但這套系統也能輕易用於其他用途。\n請問具備多種潛在用途的系統為什麼會產生道德疑慮?",

    ],
    ans: ["A"],
    exp: "【正確答案：A】\n雙重用途（Dual-use）的 AI 系統可能被濫用於監視、偽造或未經授權的侵犯隱私行為，進而引發倫理規範疑慮。"
  },
  {
    id: 11,
    q: "數間公司共同建立並監視一個特定產業的 AI 相關安全性事件資料庫，希望藉由共享資訊，讓業界部署的 AI 系統更安全。\n請問哪一位專案團隊成員應負責監視 AI 事件資料庫中的事件?",
    type: "single",
    options: [
      "A. 負責評估團隊開發中新功能的產品經理。",

    ans: ["A"],
    exp: "【正確答案：A】\n產品經理（Product Manager）負責產品的功能規劃、安全性評估與風險控管，應持續追蹤業界安全性事件以優化產品機制。"

  {

  },
  {

    type: "single",
    options: [

function renderQuiz() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  quizData.forEach((q, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${q.id}`;

    let inputType = q.type === 'single' ? 'radio' : 'checkbox';

    let optionsHTML = q.options.map((opt, i) => {
      let value = opt.substring(0, 1);
      return `
        <label class="option-label">
          <input type="${inputType}" name="q_${q.id}" value="${value}">
          <span>${opt}</span>
        </label>
      `;
    }).join('');

    card.innerHTML = `
      <div class="q-number">第 ${q.id} 題 ${q.type === 'multiple' ? '【多選題】' : '【單選題】'}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optionsHTML}</div>
      <div class="explanation" id="exp-${q.id}">
        <div class="exp-title" id="exp-title-${q.id}"></div>
        <div style="white-space: pre-line;">${q.exp}</div>
      </div>
    `;

    container.appendChild(card);
  });
}

function submitQuiz() {
  let score = 0;
  let correctCount = 0;

  quizData.forEach(q => {
    const selectedInputs = document.querySelectorAll(`input[name="q_${q.id}"]:checked`);
    const userAns = Array.from(selectedInputs).map(i => i.value).sort();
    const correctAns = [...q.ans].sort();

    const isCorrect = JSON.stringify(userAns) === JSON.stringify(correctAns);

    const expDiv = document.getElementById(`exp-${q.id}`);
    const expTitle = document.getElementById(`exp-title-${q.id}`);
    const card = document.getElementById(`card-${q.id}`);

    expDiv.style.display = 'block';

    if (isCorrect) {
      score += 2; // 50題，每題2分，滿分100分
      correctCount++;
      expDiv.className = 'explanation correct';
      expTitle.innerHTML = `<span class="correct-ans">✓ 回答正確！</span> (正確答案：${q.ans.join(', ')})`;
      card.style.borderColor = 'var(--success)';
    } else {
      expDiv.className = 'explanation incorrect';
      expTitle.innerHTML = `<span class="wrong-ans">✗ 回答錯誤！</span> (你的回答：${userAns.join(', ') || '未作答'} | 正確答案：${q.ans.join(', ')})`;
      card.style.borderColor = 'var(--error)';
    }
  });

  // 顯示分數區塊
  const scoreBoard = document.getElementById('scoreBoard');
  const scoreText = document.getElementById('scoreText');
  const scoreSummary = document.getElementById('scoreSummary');

  scoreText.innerText = `${score} / 100 分`;
  scoreSummary.innerText = `共 50 題，答對 ${correctCount} 題，答錯 ${50 - correctCount} 題。往下滑動可檢視各題詳細解析！`;
  scoreBoard.style.display = 'block';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = renderQuiz;
